services:
  - type: web
    name: samskara-buddy
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: FAL_KEY
        sync: false
      - key: MINIMAX_API_KEY
        sync: false
